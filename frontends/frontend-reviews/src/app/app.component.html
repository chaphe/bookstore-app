<div class="toolbar" role="banner">
  <img width="40" alt="IconoReseñas" src="./assets/resenas.png" />
  <span>Reseñas</span>
  <div class="spacer"></div>
  <button mat-raised-button color="primary" (click)="openDialog()">
    <mat-icon>add</mat-icon> Agregar reseña
  </button>
</div>

<div class="reviews-container" role="main">
  <div *ngIf="loading" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Cargando reseñas...</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <mat-icon>error</mat-icon>
    <span>{{ errorMessage }}</span>
    <button mat-button (click)="loadReviews()">Reintentar</button>
  </div>

  <div *ngIf="!loading && !errorMessage && reviews.length === 0" class="empty-state">
    <mat-icon>sentiment_neutral</mat-icon>
    <p>No hay reseñas todavía. ¡Sé el primero en agregar una!</p>
  </div>

  <div class="reviews-grid" *ngIf="!loading && !errorMessage && reviews.length > 0">
    <div class="card" *ngFor="let review of reviews; trackBy: trackByReview">
      <div class="card-header">
        <div class="user-info">
          <div class="avatar">
            <img src="./assets/usuario (3).png" alt="Avatar" />
          </div>
          <div class="user-details">
            <strong>{{ review.usuario }}</strong>
            <span>ISBN: {{ review.isbn }}</span>
          </div>
        </div>
        <div class="stars">
          <img [src]="'./assets/estrellas' + review.estrellas + '.png'" alt="{{ review.estrellas }} estrellas" height="40" />
        </div>
        <button mat-icon-button class="delete-btn" (click)="deleteReview(review)" matTooltip="Eliminar reseña">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
      <div class="card-content">
        <p>{{ review.comentario }}</p>
      </div>
      <div class="card-actions">
        <button mat-button (click)="openDialog(review)">
          <mat-icon>edit</mat-icon> Editar
        </button>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
