services:
  # ============================================================
  # FRONTENDS
  # ============================================================
  frontend-catalog:
    image: chaphe/frontend-catalog-image:1.2
    container_name: frontend-catalog
    environment:
      CATALOG_URL: http://localhost:8081/api
    ports:
      - "8080:80"
    networks:
      - bookstore-network
    depends_on:
      backend-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend-reviews:
    image: chaphe/frontend-reviews-image:1.2
    container_name: frontend-reviews
    environment:
      REVIEWS_URL: http://localhost:3000
    ports:
      - "8082:80"
    networks:
      - bookstore-network
    depends_on:
      backend-reviews:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend-store:
    image: chaphe/frontend-store-image:1.2
    container_name: frontend-store
    environment:
      CATALOG_URL: http://localhost:8081/api
      REVIEWS_URL: http://localhost:3000
      STORE_URL: http://localhost:8084/api
    ports:
      - "8083:80"
    networks:
      - bookstore-network
    depends_on:
      backend-catalog:
        condition: service_healthy
      backend-reviews:
        condition: service_healthy
      backend-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ============================================================
# NETWORKS
# ============================================================
networks:
  bookstore-network:
    driver: bridge
