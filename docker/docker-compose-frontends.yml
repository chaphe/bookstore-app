services:
  # ============================================================
  # FRONTENDS
  # ============================================================
  frontend-catalog:
    image: chaphe/frontend-catalog-image:1.2
    container_name: frontend-catalog
    ports:
      - "8091:80"
    networks:
      - bookstore-network
    depends_on:
      backend-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend-reviews:
    image: chaphe/frontend-reviews-image:1.2
    container_name: frontend-reviews
    ports:
      - "8092:80"
    networks:
      - bookstore-network
    depends_on:
      backend-reviews:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend-store:
    image: chaphe/frontend-store-image:1.2
    container_name: frontend-store
    ports:
      - "8093:80"
    networks:
      - bookstore-network
    depends_on:
      backend-catalog:
        condition: service_healthy
      backend-reviews:
        condition: service_healthy
      backend-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ============================================================
# NETWORKS
# ============================================================
networks:
  bookstore-network:
    driver: bridge
